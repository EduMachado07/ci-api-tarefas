# Banco PostgreSQL para desenvolvimento local: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tarefas
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d tarefas']
      interval: 5s
      timeout: 3s
      retries: 10
